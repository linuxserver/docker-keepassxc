---

# jenkins variables
project_name: docker-keepassxc
external_type: alpine_repo
custom_release_notes_command: |-
  curl -H "Authorization: token ${GITHUB_TOKEN}" -s "https://api.github.com/repos/keepassxreboot/keepassxc/releases/tags/${EXT_RELEASE%%-r*}" | jq -r '. |.body' | sed -e 's|#\\([0-9]\\+\\)|[#\\1](https://github.com/keepassxreboot/keepassxc/pull/\\1)|g' > releasebody.json
release_type: stable
release_tag: latest
ls_branch: master
build_armhf: false
repo_vars:
  - BUILD_VERSION_ARG = 'KEEPASSXC_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-keepassxc'
  - CONTAINER_NAME = 'keepassxc'
  - DOCKERHUB_IMAGE = 'linuxserver/keepassxc'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/keepassxc'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/keepassxc'
  - DIST_IMAGE = 'alpine'
  - DIST_TAG = '3.24'
  - DIST_REPO = 'http://dl-cdn.alpinelinux.org/alpine/v3.24/community/'
  - DIST_REPO_PACKAGES = 'keepassxc'
  - MULTIARCH = 'true'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_WEB_SCREENSHOT_DELAY = '30'
  - CI_DOCKERENV = 'TZ=US/Pacific'
  - CI_AUTH = 'user:password'
  - CI_WEBPATH = ''
